# --- Prometheus Config Map ---
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: fl-sim
data:
  prometheus.yml: |
    global:
      scrape_interval: 5s
    scrape_configs:
      - job_name: 'fl-coordinator'
        static_configs:
          - targets: ['coordinator:8000']
      - job_name: 'fl-clients'
        dns_sd_configs:
          - names: ['client-service']
            type: 'A'
            port: 8003
---
# --- Prometheus Deployment ---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: fl-sim
spec:
  selector:
    matchLabels:
      app: prometheus
  template:
    metadata:
      labels:
        app: prometheus
    spec:
      containers:
        - name: prometheus
          image: prom/prometheus
          volumeMounts:
            - name: config
              mountPath: /etc/prometheus/prometheus.yml
              subPath: prometheus.yml
          ports:
            - containerPort: 9090
      volumes:
        - name: config
          configMap:
            name: prometheus-config
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: fl-sim
spec:
  selector:
    app: prometheus
  ports:
    - port: 9090
      nodePort: 30090
  type: NodePort
---
# --- Grafana ---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: fl-sim
spec:
  selector:
    matchLabels:
      app: grafana
  template:
    metadata:
      labels:
        app: grafana
    spec:
      containers:
        - name: grafana
          image: grafana/grafana
          ports:
            - containerPort: 3000
---
apiVersion: v1
kind: Service
metadata:
  name: grafana
  namespace: fl-sim
spec:
  selector:
    app: grafana
  ports:
    - port: 3000
      nodePort: 30000
  type: NodePort